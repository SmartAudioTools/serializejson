# Publication sur PyPI, déclenchée par un tag de version (git tag v0.4.0 ;
# git push origin v0.4.0). Authentification par Trusted Publishing : PyPI fait
# confiance à CE fichier, dans l'environnement « pypi » — aucun mot de passe ni
# jeton stocké. Ne pas renommer ce fichier sans mettre à jour la déclaration
# sur pypi.org (Your projects > serializejson > Publishing).

name: Publication PyPI

on:
  push:
    tags: ["v*"]

jobs:
  roues_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: roues-linux
          path: wheelhouse/*.whl

  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/*.tar.gz

  publication:
    needs: [roues_linux, sources]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
